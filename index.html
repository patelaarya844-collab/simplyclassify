<!DOCTYPE html>
<html>
<head>
    <title>Attendance Even Odd</title>
</head>
<body>

    <h2>Attendance Even or Odd</h2>

    <label>Enter Attendance:</label>
    <input type="number" id="attendance">

    <button onclick="checkEvenOdd()">Check</button>

    <p id="result"></p>

    <script>
        function checkEvenOdd() {
            let attendance = document.getElementById("attendance").value;

            if (attendance % 2 == 0) {
                document.getElementById("result").innerHTML =
                    "Attendance is Even";
            } else {
                document.getElementById("result").innerHTML =
                    "Attendance is Odd";
            }
        }
    </script>

</body>
</html>
